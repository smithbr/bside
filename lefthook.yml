# Git hooks. Enable once per clone with: lefthook install

pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: 'test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; echo "fix with gofmt -w ."; exit 1; }'
    - name: vet
      glob: "*.go"
      run: go vet ./...

pre-push:
  jobs:
    - name: test
      run: go test ./...
    - name: lint
      run: golangci-lint run ./...
